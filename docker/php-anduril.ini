; =============================================================================
;  PHP settings for the anduril backend image.
;
;  Loaded as zz-anduril.ini so it sorts after the stock conf.d files and wins.
;  Note that admin/.htaccess sets some of these again, per-directory, via
;  php_value -- those apply under mod_php and override what is here for /admin.
; =============================================================================

; Errors are logged, never rendered. bootstrap.php sets display_errors from
; APP_DEBUG as well; this is the floor in case something fails before bootstrap
; runs, which is exactly when a stack trace would leak config.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Do not advertise the PHP version in the X-Powered-By header.
expose_php = Off

; Product images are capped at 1000KB by the upload handler; this leaves room
; for the multipart envelope without allowing arbitrarily large bodies.
upload_max_filesize = 8M
post_max_size = 10M

; GD holds an uncompressed bitmap of both the source and the 500x500 result
; while resizing. 32M (what the cPanel .htaccess sets) is enough for the sizes
; this accepts, but the default here is more forgiving for anything outside
; /admin.
memory_limit = 128M

; An upload plus a resize plus a bucket PUT. The S3 client has its own 20s
; timeout, so this only needs to outlast it.
max_execution_time = 60
max_input_time = 60

; Sessions are stored in the database (bootstrap/admin.php installs a
; DbSessionHandler), so no shared filesystem is needed between replicas. These
; only harden the cookie itself.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; Africa/Nairobi is set by bootstrap from APP_TIMEZONE; this is the fallback
; for anything that reads the clock before bootstrap runs.
date.timezone = Africa/Nairobi
