# =============================================================================
#  Apache configuration for the anduril backend image.
# =============================================================================

# Silences the "could not reliably determine the server's fully qualified
# domain name" warning on every start. The real hostname comes from the proxy.
ServerName localhost

# Do not advertise the PHP and Apache versions in response headers.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # Required for admin/.htaccess -- it carries the rewrite that makes
    # /admin/users resolve to users.php. Without this the file is read and
    # ignored, and every admin link 404s.
    AllowOverride All
    Require all granted
</Directory>

# -----------------------------------------------------------------------------
#  Directories that must never be reachable over HTTP
# -----------------------------------------------------------------------------
#  The document root is the repository root, so without these rules
#  db/schema.sql and db/seed.sql download as plain text -- the full schema plus
#  the seeded admin accounts. .php files are less exposed because they execute
#  and emit nothing, but .sql, .md and .example.php are served verbatim.
#
#  bin/ additionally holds maintenance scripts. They refuse to run over HTTP on
#  their own, but there is no reason to reach them at all.
<DirectoryMatch "^/var/www/html/(config|bootstrap|lib|bin|db|tests|docs|\.git)">
    Require all denied
</DirectoryMatch>

# Belt and braces: anything that is data rather than an entrypoint, wherever it
# sits in the tree.
<FilesMatch "\.(sql|md|lock|dist|example\.php)$">
    Require all denied
</FilesMatch>

# composer.json/lock reveal dependency versions; nothing needs to fetch them.
<FilesMatch "^composer\.(json|lock)$">
    Require all denied
</FilesMatch>

# Dotfiles, including .env and .gitignore.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# -----------------------------------------------------------------------------
#  Uploads
# -----------------------------------------------------------------------------
#  With a bucket configured nothing is written here, but the directory is still
#  served for the local-storage fallback. It must never execute anything: a
#  .php that survives the upload filter would otherwise be remote code
#  execution.
<Directory /var/www/html/admin/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|php[0-9]|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# -----------------------------------------------------------------------------
#  Logging
# -----------------------------------------------------------------------------
#  To stdout/stderr so the platform collects them, rather than to files inside
#  a container nobody will read.
ErrorLog /dev/stderr
TransferLog /dev/stdout
